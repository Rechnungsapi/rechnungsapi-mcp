# Reverse proxy for mcp.rechnungsapi.de -> the rechnungsapi-mcp HTTP container.
#
# Setup:
#   1. Point mcp.rechnungsapi.de's DNS (A record) at this server's IP.
#   2. Drop this file in /etc/nginx/sites-available/, symlink it into
#      sites-enabled/, then: nginx -t && systemctl reload nginx
#   3. Get a cert: certbot --nginx -d mcp.rechnungsapi.de
#      (certbot will rewrite the server block below to add the ssl_certificate
#      lines and a :443 server block automatically — safe to run before or
#      after step 2, but DNS must already point here for it to succeed)
#
# Adjust "server 127.0.0.1:3939" below if the container is published on a
# different host/port than the docker-compose.yml default.

server {
    listen 80;
    server_name mcp.rechnungsapi.de;

    # Invoices arrive as base64 PDFs. By default nginx refuses request bodies over 1 MB with a 413
    # before they reach the server, so allow what the server allows (MAX_BODY_MB, default 64).
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3939;
        proxy_http_version 1.1;

        # Required for the MCP Streamable HTTP transport's SSE responses —
        # without these, nginx buffers the stream and clients see nothing
        # until the connection closes.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Customers' RechnungsAPI tokens travel in this header end-to-end —
        # nginx passes it through untouched by default, but a proxy_pass
        # directive elsewhere in your config could strip Authorization, so
        # this exists as a defensive, explicit reminder not to do that.
        proxy_pass_request_headers on;
    }
}
