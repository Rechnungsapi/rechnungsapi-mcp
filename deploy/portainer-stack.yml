# Paste into Portainer: Stacks -> Add stack -> Web editor. Nothing to build: the container installs
# the published package from npm when it starts.
#
# To upgrade, change the version number in `command` and redeploy the stack (publishing a new version
# to npm does not touch a running container).
services:
  rechnungsapi-mcp:
    image: node:20-alpine
    container_name: rechnungsapi-mcp
    restart: unless-stopped
    # `$$` is how a compose file writes a literal `$`.
    command: sh -c "npm install -g rechnungsapi-mcp@0.3.1 && exec node $$(npm root -g)/rechnungsapi-mcp/dist/http.js"
    environment:
      PORT: "3939"
      # MAX_BODY_MB: "64"   # largest accepted request body, in MB
    # Published on this machine only: the server speaks plain HTTP, so put a TLS reverse proxy in front.
    ports:
      - "127.0.0.1:3939:3939"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3939/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s   # the first start downloads the package

# Running Nginx Proxy Manager in Docker? Drop `ports` above, put this service on the same Docker network
# as the proxy, and point the proxy host at rechnungsapi-mcp:3939:
#
#     services:
#       rechnungsapi-mcp:
#         networks: [proxy]
#     networks:
#       proxy:
#         external: true
